<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c0c"><title>مدار — هدفك يستاهل خطة</title>
<style>@font-face{font-family:Mdaar;src:url('assets/NotoSansArabic-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#0b0c0c;color:#f6f3eb;font-family:Mdaar,Tahoma,sans-serif}.wrap{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100dvh;padding:18px 16px 28px}header{display:flex;justify-content:space-between;align-items:center;width:min(100%,470px);gap:12px}h1{font-size:19px;margin:0;color:#e2c589}small{color:#b0aeab;font-size:12px}.stage{position:relative;width:min(100%,420px);aspect-ratio:9/16;background:#0b0c0c;overflow:hidden;border:1px solid #e2c58940;border-radius:10px;box-shadow:0 16px 60px #0008}iframe{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;border:0;pointer-events:none}.controls{width:min(100%,420px);display:grid;gap:12px}input[type=range]{width:100%;accent-color:#e2c589;direction:ltr;cursor:pointer}.buttons{display:flex;gap:10px;align-items:center;justify-content:center}button,a{font:inherit;cursor:pointer;border-radius:10px;padding:10px 18px;font-size:14px}button{background:#e2c589;color:#171512;border:1px solid #e2c589;font-weight:bold}button:disabled{opacity:.5;cursor:wait}.secondary{background:#171512;color:#e2c589;border:1px solid #e2c58940}.time{font:14px Arial,sans-serif;direction:ltr;color:#b0aeab;min-width:85px;text-align:center}footer{font-size:12px;color:#b0aeab;text-align:center}footer a{color:#e2c589;padding:0;font-size:12px}.store{background:#e2c589;color:#171512;text-decoration:none;font-weight:bold}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #f6f3eb;outline-offset:3px}@media(min-width:700px){.stage{width:min(420px,calc((100dvh - 230px)*.5625))}}</style>
</head><body><main class="wrap"><header><h1>إعلان مدار</h1><small>٢٠ ثانية · مقاس الريلز</small></header><div class="stage" id="stage"><iframe id="film" title="معاينة إعلان مدار" src="composition.html" allow="autoplay"></iframe></div><div class="controls"><input id="seek" type="range" min="0" max="20" value="0" step=".01" aria-label="موضع الإعلان"><div class="buttons"><button id="play" disabled>جارٍ التحميل…</button><button id="sound" class="secondary" aria-pressed="false">تشغيل الصوت</button><span class="time" id="time">0:00 / 0:20</span></div></div><a class="store" href="https://mdaar21.zid.store/products/بروتوكول-التحول" target="_blank" rel="noopener">احصل على البروتوكول</a><footer>معاينة متحركة بدون تعليق صوتي · <a href="https://mdaar21.github.io/Mdaar21/discover/" target="_blank" rel="noopener">اكتشف مدار</a></footer></main>
<script>
const frame=document.getElementById('film'),stage=document.getElementById('stage'),button=document.getElementById('play'),sound=document.getElementById('sound'),slider=document.getElementById('seek'),clock=document.getElementById('time');let timeline,media=[],playing=false,muted=true;
const fit=()=>frame.style.transform='scale('+stage.clientWidth/1080+')';new ResizeObserver(fit).observe(stage);fit();
function syncAudio(t){for(const a of media){const start=Number(a.dataset.start),end=start+Number(a.dataset.duration),active=playing&&!muted&&t>=start&&t<end;if(active){const target=t-start;if(Math.abs(a.currentTime-target)>.2)a.currentTime=target;a.volume=Number(a.dataset.volume||1);if(a.paused)a.play().catch(()=>{});}else if(!a.paused)a.pause();}}
function update(){if(timeline){const t=timeline.time();slider.value=t;clock.textContent='0:'+String(Math.floor(t)).padStart(2,'0')+' / 0:20';if(playing&&t>=19.99){playing=false;button.textContent='إعادة الإعلان';timeline.pause();}syncAudio(t);}requestAnimationFrame(update);}requestAnimationFrame(update);
frame.addEventListener('load',async()=>{const d=frame.contentDocument;await d.fonts.ready;await Promise.all(Array.from(d.images).map(i=>i.decode().catch(()=>{})));timeline=frame.contentWindow.__timelines['mdaar21-ad'];media=Array.from(d.querySelectorAll('audio'));timeline.pause(0);button.disabled=false;button.textContent='تشغيل الإعلان';});
button.onclick=()=>{if(!timeline)return;if(playing){playing=false;timeline.pause();button.textContent='متابعة الإعلان';}else{if(timeline.time()>=19.99)timeline.pause(0);playing=true;timeline.play();button.textContent='إيقاف مؤقت';}syncAudio(timeline.time());};
sound.onclick=()=>{muted=!muted;sound.textContent=muted?'تشغيل الصوت':'كتم الصوت';sound.setAttribute('aria-pressed',String(!muted));if(timeline)syncAudio(timeline.time());};slider.addEventListener('input',()=>{if(timeline){timeline.seek(Number(slider.value));syncAudio(timeline.time());}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&timeline){playing=false;timeline.pause();button.textContent='متابعة الإعلان';syncAudio(timeline.time());}});
</script></body></html>
